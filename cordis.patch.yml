# dsh-exa-mcp — the hosted Exa MCP endpoint as a DeepSeek Harness bundle.
#
# One insert row mounts https://mcp.exa.ai/mcp (Streamable HTTP) through the
# MCP client bridge shipped with dsh. Discovered tools register on ctx.tools:
#   mcp__exa__web_search_exa
#   mcp__exa__web_fetch_exa
#   mcp__exa__web_search_advanced_exa   (?tools= whitelist)
#   mcp__exa__agent_run                 (API key + ?tools= whitelist)
#
# Authentication: the endpoint answers anonymously on Exa's free tier
# (rate-limited). EXA_API_KEY adds the x-api-key header; when unset the
# expression yields {} so the request stays anonymous instead of sending an
# undefined header. OAuth (https://mcp.exa.ai/mcp?login) is not supported by
# the bridge; use an API key.
#
# failOnStartupError: false keeps an Exa outage or an offline machine from
# rejecting activation; the bridge logs the failure and reconnects. Set it to
# true if a missing Exa tool set must fail the plugin loudly instead.
#
# Override from a later layer by targeting this row id WITHOUT `insert`;
# `config` is replaced wholesale, so restate every field:
#
#   - id: mcp-exa
#     name: '@deepseek-ai/dsh-mcp-client'
#     config:
#       serverName: exa
#       transport: streamable-http
#       url: https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa
#
- insert:
    - id: mcp-exa
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: exa
        transport: streamable-http
        url: https://mcp.exa.ai/mcp
        headers: !!js 'process.env.EXA_API_KEY ? { "x-api-key": process.env.EXA_API_KEY } : {}'
        toolCallTimeoutMs: 180000
        failOnStartupError: false
